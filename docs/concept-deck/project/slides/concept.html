<section id="concept" class="dark" data-section="提案するサービス" data-transition="fade">
<p class="eyebrow">コンセプト</p>
<p class="big reveal" style="color:#FBFBF8">残すのは一瞬、<br><span class="hl">選ぶときに記録が答える。</span></p>
<p class="lead reveal" style="animation-delay:100ms">覚えておきたい一皿だけでも、口にするすべてでも。残すほど、自分の好みを誰よりも知っていて、記憶している記録帳になる。</p>
<div class="row reveal" style="animation-delay:200ms">
<div class="col" style="border-top:2px solid #3A4A70;padding-top:24px">
<h3 style="color:#FBFBF8">残す</h3>
<p class="body" style="color:#C9D2E3">シャッターだけで記録になる。種類と場所は自動で入り、名前は写真の文字から候補が出る。外食も家ごはんも、一皿も一杯も。</p>
</div>
<div class="col" style="border-top:2px solid #3A4A70;padding-top:24px">
<h3 style="color:#FBFBF8">育つ</h3>
<p class="body" style="color:#C9D2E3">点数はつけず「どっちが好き?」の 2 択だけ。自分のランキングと実績が積み重なる。</p>
</div>
<div class="col" style="border-top:2px solid #3A4A70;padding-top:24px">
<h3 style="color:#FBFBF8">使う</h3>
<p class="body" style="color:#C9D2E3">記録が好みを言葉にし、次に試す方向を出す。次の一皿・一杯を選ぶ手がかりになる。</p>
</div>
</div>

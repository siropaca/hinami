<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HINAMI ロゴ</title>
<style>
/* Overview of the two logo candidates. Open in a browser. */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #cfc8bc; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #16130f; padding: 28px; }
h1 { font-size: 18px; font-weight: 600; margin: 8px 0 14px; }
.set { margin-bottom: 36px; }
.grid { display: flex; flex-wrap: wrap; gap: 14px; }
.tile { border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 28px 32px; height: 230px; }
.paper { background: #f3eee6; }
.night { background: #16130f; color: #f2ede4; }
.cap { font-size: 12px; opacity: 0.7; }
.icon { border-radius: 22.37%; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22); }
.home { width: 330px; height: 230px; padding: 26px 24px; border-radius: 22px; background: linear-gradient(160deg, #8d9aa6, #4d5560 60%, #2f3238); display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 12px; }
.app { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #fff; font-size: 10px; }
.ph { width: 54px; height: 54px; border-radius: 22.37%; }
</style>
</head>
<body>

<div class="set" id="set-bowl">
<h1>A 器と日</h1>
<div class="grid">
  <div class="tile paper"><img src="bowl/symbol-gold.svg" width="140" height="140" alt="シンボル"><p class="cap">シンボル</p></div>
  <div class="tile night"><img src="bowl/symbol-gold-dark.svg" width="140" height="140" alt="シンボル (暗い紙面)"><p class="cap">シンボル</p></div>
  <div class="tile paper" style="width:470px"><img src="bowl/lockup-horizontal-gold.svg" height="64" alt="横組み"><p class="cap">横組み</p></div>
  <div class="tile night" style="width:470px"><img src="bowl/lockup-horizontal-gold-dark.svg" height="64" alt="横組み (暗い紙面)"><p class="cap">横組み</p></div>
  <div class="tile paper" style="width:330px"><img src="bowl/lockup-vertical-gold.svg" height="150" alt="縦組み"><p class="cap">縦組み</p></div>
  <div class="tile paper" style="width:420px"><img src="bowl/wordmark-gold.svg" height="40" alt="テキストロゴ"><p class="cap">テキストロゴ</p></div>
  <div class="tile paper" style="width:200px"><img class="icon" src="bowl/app-icon.svg" width="140" height="140" alt="アイコン"><p class="cap">アイコン</p></div>
  <div class="tile night" style="width:200px"><img class="icon" src="bowl/app-icon-tinted.svg" width="140" height="140" alt="アイコン (色付き)" style="filter: sepia(1) saturate(2.2) hue-rotate(160deg) brightness(.95)"><p class="cap">色付き (例)</p></div>
  <div class="home">
    <div class="app"><div class="ph" style="background:#f4f4f4"></div>カレンダー</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#fbd24b,#f7a31b)"></div>メモ</div>
    <div class="app"><img class="ph" src="bowl/app-icon.svg" alt="">HINAMI</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#5ad46b,#2fb24a)"></div>メッセージ</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#ff5f6d,#e83a50)"></div>ミュージック</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#6cc3ff,#2c8ef0)"></div>天気</div>
    <div class="app"><div class="ph" style="background:#fff"></div>写真</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#ff9f43,#ff6b2c)"></div>グルメ</div>
  </div>
  <div class="tile paper" style="flex-direction:row;gap:16px;width:260px"><img class="icon" src="bowl/app-icon.svg" width="60" height="60" alt=""><img class="icon" src="bowl/app-icon.svg" width="40" height="40" alt=""><img class="icon" src="bowl/app-icon.svg" width="29" height="29" alt=""><img src="bowl/symbol-ink.svg" width="16" height="16" alt=""></div>
</div>
</div>

<div class="set" id="set-seal">
<h1>B 丸に日</h1>
<div class="grid">
  <div class="tile paper"><img src="seal/symbol-gold.svg" width="140" height="140" alt="シンボル"><p class="cap">シンボル</p></div>
  <div class="tile night"><img src="seal/symbol-gold-dark.svg" width="140" height="140" alt="シンボル (暗い紙面)"><p class="cap">シンボル</p></div>
  <div class="tile paper" style="width:470px"><img src="seal/lockup-horizontal-gold.svg" height="64" alt="横組み"><p class="cap">横組み</p></div>
  <div class="tile night" style="width:470px"><img src="seal/lockup-horizontal-gold-dark.svg" height="64" alt="横組み (暗い紙面)"><p class="cap">横組み</p></div>
  <div class="tile paper" style="width:330px"><img src="seal/lockup-vertical-gold.svg" height="150" alt="縦組み"><p class="cap">縦組み</p></div>
  <div class="tile paper" style="width:420px"><img src="seal/wordmark-gold.svg" height="40" alt="テキストロゴ"><p class="cap">テキストロゴ</p></div>
  <div class="tile paper" style="width:200px"><img class="icon" src="seal/app-icon.svg" width="140" height="140" alt="アイコン"><p class="cap">アイコン</p></div>
  <div class="tile night" style="width:200px"><img class="icon" src="seal/app-icon-tinted.svg" width="140" height="140" alt="アイコン (色付き)" style="filter: sepia(1) saturate(2.2) hue-rotate(160deg) brightness(.95)"><p class="cap">色付き (例)</p></div>
  <div class="home">
    <div class="app"><div class="ph" style="background:#f4f4f4"></div>カレンダー</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#fbd24b,#f7a31b)"></div>メモ</div>
    <div class="app"><img class="ph" src="seal/app-icon.svg" alt="">HINAMI</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#5ad46b,#2fb24a)"></div>メッセージ</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#ff5f6d,#e83a50)"></div>ミュージック</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#6cc3ff,#2c8ef0)"></div>天気</div>
    <div class="app"><div class="ph" style="background:#fff"></div>写真</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#ff9f43,#ff6b2c)"></div>グルメ</div>
  </div>
  <div class="tile paper" style="flex-direction:row;gap:16px;width:260px"><img class="icon" src="seal/app-icon.svg" width="60" height="60" alt=""><img class="icon" src="seal/app-icon.svg" width="40" height="40" alt=""><img class="icon" src="seal/app-icon.svg" width="29" height="29" alt=""><img src="seal/symbol-ink.svg" width="16" height="16" alt=""></div>
</div>
</div>

</body>
</html>

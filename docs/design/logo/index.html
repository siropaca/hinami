<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HINAMI ロゴ</title>
<style>
/* Overview of the logo set. Open in a browser. */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #cfc8bc; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #16130f; padding: 32px; }
h2 { font-size: 15px; font-weight: 600; margin: 28px 0 12px; }
.grid { display: flex; flex-wrap: wrap; gap: 16px; }
.tile { border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 36px 40px; }
.paper { background: #f3eee6; }
.night { background: #16130f; color: #f2ede4; }
.cap { font-size: 12px; opacity: 0.7; }
.icon { border-radius: 22.37%; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22); overflow: hidden; }
.home { width: 420px; padding: 34px 30px; border-radius: 28px; background: linear-gradient(160deg, #8d9aa6, #4d5560 60%, #2f3238); display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 14px; }
.app { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #fff; font-size: 11px; }
.ph { width: 64px; height: 64px; border-radius: 22.37%; }
</style>
</head>
<body>

<div id="sheet-marks">
<h2>シンボル · テキストロゴ</h2>
<div class="grid">
  <div class="tile paper"><img src="symbol-gold.svg" width="150" height="150" alt="シンボル (明るい紙面)"><p class="cap">シンボル · 金 #8F7832</p></div>
  <div class="tile night"><img src="symbol-gold-dark.svg" width="150" height="150" alt="シンボル (暗い紙面)"><p class="cap">シンボル · 金 #B8995F</p></div>
  <div class="tile paper" style="width:520px"><img src="wordmark-gold.svg" height="46" alt="テキストロゴ (明るい紙面)"><p class="cap">テキストロゴ · Cormorant Garamond Medium を輪郭化</p></div>
  <div class="tile night" style="width:520px"><img src="wordmark-gold-dark.svg" height="46" alt="テキストロゴ (暗い紙面)"><p class="cap">テキストロゴ</p></div>
</div>
</div>

<div id="sheet-lockups">
<h2>シンボルとテキストのセット</h2>
<div class="grid">
  <div class="tile paper" style="width:520px;height:250px"><img src="lockup-horizontal-gold.svg" height="80" alt="横組み (明るい紙面)"><p class="cap">横組み</p></div>
  <div class="tile night" style="width:520px;height:250px"><img src="lockup-horizontal-gold-dark.svg" height="80" alt="横組み (暗い紙面)"><p class="cap">横組み</p></div>
  <div class="tile paper" style="width:300px;height:250px"><img src="lockup-vertical-gold.svg" height="150" alt="縦組み (明るい紙面)"><p class="cap">縦組み</p></div>
  <div class="tile night" style="width:300px;height:250px"><img src="lockup-vertical-gold-dark.svg" height="150" alt="縦組み (暗い紙面)"><p class="cap">縦組み</p></div>
  <div class="tile paper" style="width:300px;height:250px"><img src="lockup-vertical-ink.svg" height="150" alt="縦組み (墨 1 色)"><p class="cap">1 色 (墨)</p></div>
</div>
</div>

<div id="sheet-icons">
<h2>アプリのアイコン</h2>
<div class="grid">
  <div class="tile paper"><img class="icon" src="app-icon.svg" width="180" height="180" alt="アイコン (標準)"><p class="cap">標準</p></div>
  <div class="tile night"><img class="icon" src="app-icon-dark.svg" width="180" height="180" alt="アイコン (ダーク)"><p class="cap">ダーク</p></div>
  <div class="tile night"><img class="icon" src="app-icon-tinted.svg" width="180" height="180" alt="アイコン (色付きの元)" style="filter: sepia(1) saturate(2.2) hue-rotate(160deg) brightness(.95)"><p class="cap">色付き (OS が色を付けた例)</p></div>
  <div class="home">
    <div class="app"><div class="ph" style="background:#f4f4f4"></div>カレンダー</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#fbd24b,#f7a31b)"></div>メモ</div>
    <div class="app"><img class="ph" src="app-icon.svg" alt="HINAMI のアイコン">HINAMI</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#5ad46b,#2fb24a)"></div>メッセージ</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#ff5f6d,#e83a50)"></div>ミュージック</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#6cc3ff,#2c8ef0)"></div>天気</div>
    <div class="app"><div class="ph" style="background:#fff"></div>写真</div>
    <div class="app"><div class="ph" style="background:linear-gradient(#ff9f43,#ff6b2c)"></div>グルメ</div>
  </div>
  <div class="tile paper" style="flex-direction:row;gap:20px"><img class="icon" src="app-icon.svg" width="60" height="60" alt=""><img class="icon" src="app-icon.svg" width="40" height="40" alt=""><img class="icon" src="app-icon.svg" width="29" height="29" alt=""><p class="cap">60 · 40 · 29 px</p></div>
</div>
</div>

</body>
</html>

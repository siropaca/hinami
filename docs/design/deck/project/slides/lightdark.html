<div class="head">
<p class="eyebrow">LIGHT &amp; DARK</p>
<h2>明るい紙面と暗い紙面を、<br>同じ質で作る。<br>OS の設定で切り替わる</h2>
</div>
<div class="col">
<div class="item"><p class="no">01</p><p class="it">色の名前は同じで、値だけを入れ替える</p></div>
<div class="item"><p class="no">02</p><p class="it">「暗い = 夜と酒、明るい = 朝とカフェ」にしない。見本も同じ中身で見せる</p></div>
<div class="item"><p class="no">03</p><p class="it">カメラだけは、どちらでもいつも暗い (写真を見る面として、OS のカメラと同じ)</p></div>
</div>
</div>
<div class="foot"><p>HINAMI デザインコンセプト</p><p class="pg"></p></div>
<aside>右の 2 台は同じホーム。暗い紙面は前の案の良さ (写真が光る、大人っぽい) を引き継ぎ、明るい紙面は朝や昼の食事、明るい場所での見やすさを受け持つ。</aside>

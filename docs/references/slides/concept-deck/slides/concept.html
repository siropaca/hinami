<section id="concept" class="dark" data-transition="fade">
<p class="eyebrow">コンセプト</p>
<p class="big reveal" style="color:#FBFBF8">自分だけの<br><span class="hl">「おいしかった」図鑑。</span></p>
<div class="row reveal" style="animation-delay:200ms">
<div class="col" style="border-top:2px solid #3A4A70;padding-top:24px">
<h3 style="color:#FBFBF8">残す</h3>
<p class="body" style="color:#C9D2E3">アプリで撮っても、撮った写真から選んでもよい。日時と場所から店を推定。手料理も一杯の酒も、同じように残せる。</p>
</div>
<div class="col" style="border-top:2px solid #3A4A70;padding-top:24px">
<h3 style="color:#FBFBF8">育つ</h3>
<p class="body" style="color:#C9D2E3">点数はつけず「どっちが好き?」の 2 択だけ。自分のベストと地図が勝手に育つ。</p>
</div>
<div class="col" style="border-top:2px solid #3A4A70;padding-top:24px">
<h3 style="color:#FBFBF8">使える</h3>
<p class="body" style="color:#C9D2E3">次に行く店を選ぶ、人に勧める、思い出を見返す。溜めた記録がそのまま役に立つ。</p>
</div>
</div>

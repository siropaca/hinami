<div class="head">

</div>
<div class="row" style="flex:1">
<div class="card">
<p class="label">写真フォルダ</p>
<p class="ok">○ 誰でも撮っている</p>
<p class="ng">× 日常の写真に埋もれる<br>× 店名も感想も残らない<br>× どれが一番だったか分からない</p>
</div>
<div class="card">
<p class="label">グルメサイト・地図アプリ</p>
<p class="ok">○ 店の情報が揃っている</p>
<p class="ng">× 他人の評価で「探す」道具<br>× 自分の記録は付録扱い<br>× 手料理は対象外</p>
</div>
<div class="card">
<p class="label">SNS</p>
<p class="ok">○ 人に見せられる</p>
<p class="ng">× 使わない人も多い<br>× 見せる前提で気軽に残せない<br>× あとから引き出しにくい</p>
</div>
</div>
<p class="lead">「あの店どこだっけ」「あの時のワインは何だったか」に、どの手段も答えられない。</p>

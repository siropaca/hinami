<section id="concept" class="dark">
<div class="head">
<p class="eyebrow">CONCEPT</p>
<h2>世界観は「夜の帳面」。写真を主役に、暦と印で個性を出す</h2>
</div>
<div class="row" style="flex:1;align-items:stretch">
<div class="col reveal" style="border-top:1px solid #B8995F;padding-top:28px;gap:20px">
<p class="num">01</p>
<h3>写真が主役</h3>
<p class="body">一覧も詳細も写真を大きく見せる。文字と線は細く小さく抑え、料理と酒の色を引き立てる。</p>
</div>
<div class="col reveal" style="border-top:1px solid #B8995F;padding-top:28px;gap:20px;animation-delay:150ms">
<p class="num">02</p>
<h3>墨と生成り、差し色は金と朱</h3>
<p class="body">背景は墨色、文字は生成り。金は操作する所だけ、朱は「印」だけに使い、色数を絞る。</p>
</div>
<div class="col reveal" style="border-top:1px solid #B8995F;padding-top:28px;gap:20px;animation-delay:300ms">
<p class="num">03</p>
<h3>日次のモチーフ</h3>
<p class="body">日付を大きな欧文数字で刻み、記録は帳面の 1 行のように並ぶ。図鑑は朱印を押して埋めていく。</p>
</div>
</div>
<div class="foot"><span>HINAMI デザインの方向性</span><span>2</span></div>
</section>
